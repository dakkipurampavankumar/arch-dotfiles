[opener]
edit = [
    { run = 'footclient -e nvim "$@" & swaymsg "[app_id=yazi-float] kill"', orphan = true, desc = "Neovim", for = "unix" }
]
zathura = [
    { run = 'zathura "$@" & swaymsg "[app_id=yazi-float] kill"', orphan = true, desc = "Open with Zathura", for = "unix" }
]
terminal = [
    { run = 'footclient -D "$@" & swaymsg "[app_id=yazi-float] kill"', orphan = true, desc = "Open terminal here", for = "unix" }
]
mpv = [
    { run = 'mpv "$@" & swaymsg "[app_id=yazi-float] kill"', orphan = true, desc = "Open with mpv", for = "unix" }
]

[open]
prepend_rules = [
    # Pressing Enter on a folder opens footclient in that path
    { mime = "inode/directory", use = "terminal" },
    # Fallback directory match just in case the MIME check fails
    { url = "*/", use = "terminal" },

    # Open Videos and Audio with mpv
    { mime = "video/*", use = "mpv" },
    { mime = "audio/*", use = "mpv" },

    # Open PDFs with Zathura
    { mime = "application/pdf", use = "zathura" },

    # Catch MIME types first
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    
    # Use 'url' instead of 'name' for file extensions
    { url = "*.c", use = "edit" },
    { url = "*.cpp", use = "edit" },
    { url = "*.h", use = "edit" },
    { url = "*.md", use = "edit" }
]
