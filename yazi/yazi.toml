[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" }
]

[open]
prepend_rules = [
    # Catch MIME types first
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    
    # Use 'url' instead of 'name' for file extensions
    { url = "*.c", use = "edit" },
    { url = "*.cpp", use = "edit" },
    { url = "*.h", use = "edit" },
    { url = "*.md", use = "edit" }
]
