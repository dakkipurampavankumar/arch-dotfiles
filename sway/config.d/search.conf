# 1. Define floating rules for the FZF Launcher
for_window [app_id="fzf-launcher"] floating enable, resize set height 700, resize set width 1200, move position center

# 2. File & Directory Search
bindsym $mod+s exec footclient --app-id fzf-launcher -e ~/.config/sway/scripts/fzf-launcher.sh file

# 3. Content Search (Ripgrep)
bindsym $mod+Shift+s exec footclient --app-id fzf-launcher -e ~/.config/sway/scripts/fzf-launcher.sh content
