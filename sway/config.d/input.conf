# Input & Keyboard Configuration

#changing r_alt -> r_ctrl & caps -> super(Mod4)
input * {
    xkb_options "ctrl:swap_ralt_rctl,caps:super"
    repeat_delay 300
    repeat_rate 60
}
seat seat0 hide_cursor 3000

# Touchpad
input type:touchpad {
    tap enabled
    accel_profile adaptive
    pointer_accel 0.4
    natural_scroll disabled
    scroll_factor 1.5
    dwt enabled
}
