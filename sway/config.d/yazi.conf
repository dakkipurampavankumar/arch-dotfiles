# 1. Define the rules for the floating window (Removed scratchpad rules)
for_window [app_id="yazi-float"] floating enable, resize set height 700, resize set width 1200, move position center

# 2. Toggle Yazi (Kill if open, Launch if closed)
bindsym $mod+e exec swaymsg -t get_tree | grep -q '"app_id": "yazi-float"' && swaymsg '[app_id="yazi-float"] kill' || kitty --class yazi-float -e yazi
