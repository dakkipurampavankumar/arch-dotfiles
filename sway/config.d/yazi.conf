# 1. Define the rules for the floating window
for_window [app_id="yazi-float"] floating enable, resize set height 700, resize set width 1200, move position center, move scratchpad, scratchpad show

# 2. Launch Yazi silently in the background when Sway starts
bindsym $mod+e exec alacritty --class yazi-float -e yazi

# 3. The toggle keybinding (using Super + y)
bindsym $mod+Shift+e [app_id="yazi-float"] scratchpad show
