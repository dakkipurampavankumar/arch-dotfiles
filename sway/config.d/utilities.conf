# ── Notification Daemon ──
exec mako

# ── Clipboard System ──
# Keep clipboard alive even after source app closes (fixes Wayland clipboard loss)
exec wl-clip-persist --clipboard regular
# Watch clipboard (text + images) — stored in cliphist
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Core: browse & paste from history
bindsym $mod+v exec clipboard-actions paste
# Action menu: snippets, save-to-file, open URL, plain text, delete, wipe
bindsym $mod+c exec clipboard-actions menu
# Quick: delete a sensitive entry from history
bindsym $mod+Shift+v exec clipboard-actions delete
# Quick: save current clipboard as a reusable snippet
bindsym $mod+Ctrl+s exec clipboard-actions save-snippet
# Quick: paste a saved snippet
bindsym $mod+grave exec clipboard-actions snippets

# ── Screenshot ──
# Full screen → save to file + copy path to clipboard
bindsym $mod+p exec bash -c 'f=~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && grim "$f" && echo -n "$f" | wl-copy && notify-send "Screenshot" "Saved: $f"'
# Select region → save to file + copy path to clipboard
bindsym $mod+Shift+p exec bash -c 'f=~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && grim -g "$(slurp)" "$f" && echo -n "$f" | wl-copy && notify-send "Screenshot" "Saved: $f"'



# ── MPD / Music Controls ──
bindsym $mod+m exec mpc toggle
bindsym $mod+comma exec mpc prev
bindsym $mod+period exec mpc next

# ncmpcpp scratchpad
for_window [app_id="ncmpcpp-scratchpad"] floating enable, move position center, resize set height 700, resize set width 1200, move scratchpad, scratchpad show
bindsym $mod+Shift+m exec swaymsg '[app_id="ncmpcpp-scratchpad"] scratchpad show' || footclient --app-id ncmpcpp-scratchpad -e ncmpcpp
