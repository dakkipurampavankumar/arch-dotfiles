# ── Notification Daemon ──
exec mako

# ── Clipboard History ──
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
bindsym $mod+v exec cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# ── Screenshot Enhancements ──
# Full screen → clipboard
bindsym Print exec grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
# Select region → clipboard
bindsym $mod+Shift+p exec grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"
# Select region → file
bindsym $mod+p exec grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "Saved to ~/Pictures"



# ── MPD / Music Controls ──
bindsym $mod+m exec mpc toggle
bindsym $mod+comma exec mpc prev
bindsym $mod+period exec mpc next
bindsym $mod+Shift+m exec footclient -e ncmpcpp
