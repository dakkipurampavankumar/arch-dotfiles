# 1. Define the rules for the floating ncmpcpp window
for_window [app_id="ncmpcpp-float"] {
    floating enable
    move position center
    resize set height 700
    resize set width 1200
    move scratchpad
    scratchpad show
}

# 2. Launch ncmpcpp silently in the background
bindsym $mod+Shift+m exec kitty --class ncmpcpp-float -e ncmpcpp

# 3. Toggle the UI with Super + M
bindsym $mod+m [app_id="ncmpcpp-float"] scratchpad show

# Super + Alt + Vim Keys for MPD controls via mpc
bindsym $mod+Mod1+h exec mpc prev        # Left: Previous Track
bindsym $mod+Mod1+l exec mpc next        # Right: Next Track
bindsym $mod+Mod1+j exec mpc toggle      # Toggle Play/Pause
bindsym $mod+Mod1+k exec mpc stop        # Stop Playback

# 4. Seeking & Repeat Controls
bindsym $mod+Mod1+f exec mpc seek -10    # Rewind 10 seconds 
bindsym $mod+Mod1+g exec mpc seek +10    # Fast Forward 10 seconds
bindsym $mod+Mod1+r exec mpc single      # Toggle Repeat Current Song
