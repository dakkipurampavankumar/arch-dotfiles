# 1. Define the rules for the floating cmus window
for_window [app_id="cmus-float"] {
    floating enable
    move position center
    resize set height 700
    resize set width 1200
    move scratchpad
    scratchpad show
}

# 2. Launch cmus silently in the background
bindsym $mod+Shift+m exec alacritty --class cmus-float -e cmus

# 3. Toggle the UI with Super + M
bindsym $mod+m [app_id="cmus-float"] scratchpad show

# Super + Alt + Vim Keys for cmus controls
bindsym $mod+Mod1+h exec cmus-remote -r      # Left: Previous Track
bindsym $mod+Mod1+l exec cmus-remote -n      # Right: Next Track
bindsym $mod+Mod1+j exec cmus-remote -u      # Toggle Play/Pause
bindsym $mod+Mod1+k exec cmus-remote -s      # Stop Playback
bindsym $mod+Mod1+f exec cmus-remote -C "player-prev-album" # Previous Album
bindsym $mod+Mod1+g exec cmus-remote -C "player-next-album" # Next Album
bindsym $mod+Mod1+r exec cmus-remote -C "toggle repeat_current" # Repeat Current Song
