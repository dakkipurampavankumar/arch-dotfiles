# ~/.config/sway/config.d/yt-x.conf — Floating YouTube Client (yt-x)

# 1. Define behavior for the yt-x scratchpad window
for_window [app_id="yt-x-float"] floating enable, move position center, resize set height 700, resize set width 1200, move scratchpad, scratchpad show

# 2. Toggle yt-x scratchpad (Show/Hide if open, Launch if closed)
bindsym $mod+y exec swaymsg '[app_id="yt-x-float"] scratchpad show' || footclient --app-id yt-x-float -e yt-x

# 3. Automatically hide yt-x scratchpad when mpv starts playing video
for_window [app_id="mpv"] [app_id="yt-x-float"] move scratchpad
