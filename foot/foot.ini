# ==============================================================================
# MAIN SETTINGS
# ==============================================================================
[main]
# Font family and size (fontconfig syntax)
font=JetBrainsMono Nerd Font:weight=medium:size=11.5

# Blank space around the window in pixels (horizontal x vertical)
pad=6x0

# Disable DPI-aware scaling so font size stays exactly as specified
dpi-aware=no

# ==============================================================================
# SCROLLING
# ==============================================================================
[scrollback]
lines=5000
multiplier=3.0

# ==============================================================================
# CURSOR SETTINGS
# ==============================================================================
[cursor]
style=block
blink=no

# ==============================================================================
# MOUSE SETTINGS
# ==============================================================================
[mouse]
hide-when-typing=yes

# ==============================================================================
# BELL SETTINGS
# ==============================================================================
[bell]
urgent=no
notify=no

