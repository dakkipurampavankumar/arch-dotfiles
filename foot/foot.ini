# ==============================================================================
# MAIN SETTINGS
# ==============================================================================
[main]
# Font family and size (fontconfig syntax)
font=JetBrainsMono Nerd Font:weight=medium:size=11.5

# Blank space around the window in pixels (horizontal x vertical)
pad=6x0

# Disable DPI-aware scaling so font size stays exactly as specified
dpi-aware=no

# ==============================================================================
# SCROLLING
# ==============================================================================
[scrollback]
lines=5000
multiplier=3.0

# ==============================================================================
# CURSOR SETTINGS
# ==============================================================================
[cursor]
style=block
blink=no

# ==============================================================================
# MOUSE SETTINGS
# ==============================================================================
[mouse]
hide-when-typing=yes

# ==============================================================================
# BELL SETTINGS
# ==============================================================================
[bell]
urgent=no
notify=no

# ==============================================================================
# COLORS (Nightly Inspired Theme)
# ==============================================================================
[colors-dark]
alpha=1.0
background=000000
foreground=a6accd

cursor=0f111a 82aaff


selection-foreground=ffffff
selection-background=5c6370

# Standard Terminal Colors (0-7)
regular0=1b1e28
regular1=f07178
regular2=c3e88d
regular3=ffcb6b
regular4=82aaff
regular5=c792ea
regular6=89ddff
regular7=a6accd

# Bright Terminal Colors (8-15)
bright0=4a5057
bright1=ff8b92
bright2=ddf2a6
bright3=ffe585
bright4=9cc4ff
bright5=e1acff
bright6=a3f7ff
bright7=ffffff

# ==============================================================================
# KEY BINDINGS
# ==============================================================================
# Foot uses Control+Shift as its default modifier.
# Uncomment and customize below if needed.
# [key-bindings]
# clipboard-copy=Control+Shift+c
# clipboard-paste=Control+Shift+v
