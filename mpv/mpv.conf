# ==========================================
# Default: AMD Integrated Graphics
# ==========================================
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi

# Force lightweight downscaling (matches Firefox efficiency)
dscale=bilinear
cscale=bilinear
dither-depth=no
correct-downscaling=no
linear-downscaling=no
# ==========================================
# Override: NVIDIA Discrete Graphics
# ==========================================
[nvidia]
profile-cond=os.getenv("__NV_PRIME_RENDER_OFFLOAD") == "1"
vo=gpu-next
gpu-api=vulkan
hwdec=nvdec
