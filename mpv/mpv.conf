# ==========================================
# Global Ultra-Lightweight Settings
# ==========================================
profile=fast
vo=gpu
hwdec=auto-safe

# Force the most basic, cheapest scaling algorithms
scale=bilinear
cscale=bilinear
dscale=bilinear
tscale=oversample
dither-depth=no
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
deband=no

[network-streams]
profile-desc="Use HDD disk cache for YouTube and streams"
profile-cond=demuxer_via_network==true
profile-restore=copy
cache=yes
cache-on-disk=yes
demuxer-cache-dir=/mnt/HDD/MPV-Cache/
  
[local-files]
profile-desc="Use RAM cache for local files (prevents HDD stutter)"
profile-cond=demuxer_via_network==false
profile-restore=copy
cache=yes
cache-on-disk=no
# Adjust the RAM cache size below based on your available memory
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=50MiB
