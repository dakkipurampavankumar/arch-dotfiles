# ==============================================================================
# WINDOW SETTINGS
# ==============================================================================
# Blank space added around the window in pixels. Format: top/bottom left/right
window_padding_width 0 8

# Window decorations. 'no' keeps the title bar (equivalent to decorations = "Full")
hide_window_decorations no

# Opacity of the background.
background_opacity 0.80

# ==============================================================================
# SCROLLING (Resource Efficiency)
# ==============================================================================
# Maximum number of lines in the scrollback buffer.
scrollback_lines 5000

# Number of lines scrolled for every line scrolled by the mouse wheel.
wheel_scroll_multiplier 3.0

# ==============================================================================
# FONT SETTINGS
# ==============================================================================
# Font family. Kitty handles regular, bold, and italic mapping automatically 
# if you set them to 'auto'.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Font size in points.
font_size 11.5

# ==============================================================================
# COLORS (Nightly Inspired Theme)
# ==============================================================================
# Primary
background #0F111A
foreground #A6ACCD
dim_foreground #676E95

# Selection
selection_foreground #FFFFFF
selection_background #5C6370

# Cursor Colors
cursor_text_color #0F111A
cursor #82AAFF

# Standard Terminal Colors (0-7)
color0  #1B1E28
color1  #F07178
color2  #C3E88D
color3  #FFCB6B
color4  #82AAFF
color5  #C792EA
color6  #89DDFF
color7  #A6ACCD

# Bright Terminal Colors (8-15)
color8  #4A5057
color9  #FF8B92
color10 #DDF2A6
color11 #FFE585
color12 #9CC4FF
color13 #E1ACFF
color14 #A3F7FF
color15 #FFFFFF

# ==============================================================================
# CURSOR SETTINGS
# ==============================================================================
# Cursor style (block, beam, underline)
cursor_shape block

# Set to 0 to disable cursor blinking
cursor_blink_interval 0

# ==============================================================================
# SELECTION & MOUSE
# ==============================================================================
# Automatically copy selected text to the clipboard.
copy_on_select clipboard

# Hide the mouse cursor when typing (-1 means immediately hide).
mouse_hide_wait -1

enable_audio_bell no

#0 - it wont ask for confirmation for termination 
confirm_os_window_close 0
